# Alembic Configuration File
# This file is part of the SQLAlchemy Alembic migration tool.

# Path to migration scripts
script_location = migrations

# template_location =

# Version path location
version_path_separator = :

# Version locations
version_locations = %(here)s/migrations/versions

# SQLAlchemy database URL - configure in env.py
sqlalchemy.url = driver://user:password@localhost/dbname

# Set to 'true' for a fresh start
# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
